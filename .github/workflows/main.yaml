name: DevOps CI Pipeline

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start MySQL for integration tests
        run: docker compose up -d --wait mysql

      - name: Build JAR, run unit and integration tests, and create JaCoCo report
        run: mvn clean verify -Pintegration-tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devopspassword

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t devops-population-app .

      - name: Run application with MySQL
        run: docker compose up --build --exit-code-from app

      - name: Run report integration smoke tests against MySQL
        run: bash scripts/integration-smoke.sh

      - name: Show application logs
        if: always()
        run: docker compose logs app

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  update-master-coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Generate master coverage badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true

      - name: Commit updated master coverage badges
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update JaCoCo coverage badges"
